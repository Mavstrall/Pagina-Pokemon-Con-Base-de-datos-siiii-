<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokédex con Base de Datos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <nav class="navbar navbar-dark barra">
      <div class="container">
        <span class="navbar-brand mb-0 h1">Pokédex con Base de Datos</span>
        <span id="estado" class="badge text-bg-secondary">Conectando...</span>
      </div>
    </nav>
  </header>

  <main class="container my-4">

    <section class="card filtros mb-4">
      <div class="card-body">
        <h2 class="h5 mb-3">Filtrar Pokémon</h2>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="buscador" class="form-label">Nombre o número</label>
            <input type="text" id="buscador" class="form-control" placeholder="Ej: pika, char, 25" oninput="filtrar()">
          </div>
          <div class="col-md-4">
            <label for="filtroTipo" class="form-label">Tipo</label>
            <select id="filtroTipo" class="form-select" onchange="filtrar()">
              <option value="">Todos los tipos</option>
            </select>
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <button class="btn btn-outline-secondary w-100" onclick="limpiarFiltros()">Limpiar</button>
          </div>
        </div>
      </div>
    </section>

    <section>
      <p id="contador" class="text-muted">Cargando datos...</p>
      <div id="lista" class="row g-3"></div>
    </section>

  </main>

  <footer class="pie text-center py-3">
    <p class="mb-0">Miguel Villarroel :D</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
